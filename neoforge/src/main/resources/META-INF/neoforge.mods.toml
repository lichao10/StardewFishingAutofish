modLoader="javafml"
loaderVersion="${neoforge_loader_version_range}"
license="${license}"
issueTrackerURL="https://github.com/lichao10/StardewFishingAutofish/issues"
[[mods]]
modId="${mod_id}"
version="${version}"
displayName="星露谷自动钓鱼（${mod_name}）"
logoFile="assets/${mod_id}/icon.png"
authors="${mod_author}"
displayURL="https://github.com/lichao10/StardewFishingAutofish"
description='''${description}'''
[[mixins]]
config="${mod_id}.mixins.json"
[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="[${neoforge_version},21.2)"
ordering="NONE"
side="CLIENT"
[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="CLIENT"
[[dependencies.${mod_id}]]
modId="stardew_fishing"
type="required"
versionRange="[${stardew_fishing_version}]"
ordering="AFTER"
side="CLIENT"
