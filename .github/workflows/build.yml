name: Build
on:
  push:
    branches: ['**']
    tags: ['v*-mc*-forge']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            17
            21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and test
        run: sh gradlew build collectArtifacts --no-daemon
      - name: Check release tag
        if: github.ref_type == 'tag'
        run: sh gradlew verifyReleaseTag -PreleaseTag=${{ github.ref_name }} --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: StardewFishingAutofish-1.19.2
          path: build/releases/
          if-no-files-found: error
