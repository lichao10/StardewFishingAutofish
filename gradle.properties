# Important Notes:
# Add new mod metadata fields to the root build.gradle expandProps map.
# Per-target Minecraft, loader and Stardew Fishing versions are pinned in targets.json.
# Keep them there so the different Minecraft versions can be built independently.

# Project
version=1.4.1
group=io.github.lichao10.stardewfishingautofish

# Common
mod_name=Stardew Fishing Autofish
mod_author=liu_li_chao_xi
mod_id=stardew_fishing_autofish
license=MIT
description=Client-side automatic fishing with treasure-first control. Toggle with F8 (rebindable).

# Java
# Gradle runs on JDK 21; common code and Minecraft 1.20.1 target Java 17.
# The optional Minecraft 1.21.1 target uses Java 21, as defined in targets.json.
gradle_java_version=21
java_version=17

# Minecraft / Forge / NeoForge
# Default targets: Minecraft 1.20.1, Forge 47.4.0 and NeoForge 47.1.106.
# Additional target: Minecraft 1.21.1, NeoForge 21.1.197.
# Select one with -Ptarget=forge-1.20.1, neoforge-1.20.1 or neoforge-1.21.1.
# Edit targets.json to change a target's game/loader versions or dependency lock.

# Stardew Fishing dependency
# All targets require Stardew Fishing 3.7, with a separate pinned file per game version.
# File IDs and SHA-512 hashes are recorded in targets.json.

# Gradle
org.gradle.jvmargs=-Xmx3G -Dfile.encoding=UTF-8
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
