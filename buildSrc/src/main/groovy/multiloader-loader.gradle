plugins { id 'java-library'; id 'idea' }

// Loader-independent build conventions; game APIs stay in the adapter projects.
base { archivesName = "StardewFishingAutofish-${minecraft_version}-${loader}" }
java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version)
    withSourcesJar()
}
repositories {
    exclusiveContent {
        forRepository { maven { name = 'Modrinth'; url = 'https://api.modrinth.com/maven' } }
        filter { includeGroup 'maven.modrinth' }
    }
    mavenCentral()
}
configurations.create('upstreamArtifact') {
    canBeConsumed = false
    canBeResolved = true
    transitive = false
}
def shared = project(':common')
sourceSets.main.java.srcDir(rootProject.file('common/src/main/java'))
sourceSets.main.java.srcDir(shared.layout.buildDirectory.dir('generated/sources/identity'))
sourceSets.main.resources.srcDir(rootProject.file('common/src/main/resources'))
sourceSets.test.java.srcDir(rootProject.file('common/src/platformTest/java'))
tasks.named('compileJava') { dependsOn ':common:generateModIdentity', 'verifyPinnedDependency' }
tasks.named('sourcesJar') { dependsOn ':common:generateModIdentity' }
dependencies {
    upstreamArtifact "maven.modrinth:stardew-fishing:${stardew_fishing_version_id}"
    testImplementation platform('org.junit:junit-bom:5.11.4')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}
sourceSets.test.compileClasspath += sourceSets.main.compileClasspath
sourceSets.test.runtimeClasspath += sourceSets.main.runtimeClasspath
tasks.named('test') { useJUnitPlatform() }
tasks.named('processResources', ProcessResources) {
    def values = rootProject.expandProps + [
        minecraft_version: minecraft_version,
        loader_version: loader_version,
        java_version: java_version,
        stardew_fishing_version: stardew_fishing_version
    ]
    inputs.properties values
    filesMatching(['META-INF/mods.toml', 'META-INF/neoforge.mods.toml']) { expand values }
}
tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8'; options.release = java_version }
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
tasks.named('jar', Jar) {
    from(rootProject.file('LICENSE')) { into 'META-INF' }
    from(rootProject.file('THIRD_PARTY_NOTICES.md')) { into 'META-INF' }
    manifest.attributes('Implementation-Title': mod_name,
            'Implementation-Version': project.version, 'Implementation-Vendor': mod_author)
}
idea.module { downloadSources = true; downloadJavadoc = true }
tasks.register('verifyPinnedDependency') {
    group = 'verification'
    inputs.file(rootProject.file('targets.json'))
    inputs.files(configurations.upstreamArtifact)
    doLast {
        def jar = configurations.upstreamArtifact.singleFile
        def actual = java.util.HexFormat.of().formatHex(java.security.MessageDigest.getInstance('SHA-512').digest(jar.bytes))
        if (actual != stardew_fishing_sha512) throw new GradleException("Wrong Stardew Fishing file for ${project.name}")
        logger.lifecycle("Verified Stardew Fishing ${stardew_fishing_version}: ${minecraft_version} ${loader} / SHA-512")
    }
}
project.pluginManager.apply('multiloader-verification')
