sourceSets {
    simulation {
        java.srcDir rootProject.file('common/src/simulation/java')
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    biteTest {
        compileClasspath += sourceSets.main.output + sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}
def behaviorFile = layout.buildDirectory.file('simulation/behaviors.csv')
tasks.register('prepareSimulation') {
    inputs.files(configurations.upstreamArtifact)
    outputs.file(behaviorFile)
    doLast {
        def jar = configurations.upstreamArtifact.singleFile
        new java.util.zip.ZipFile(jar).withCloseable { zip ->
            def data = new groovy.json.JsonSlurper().parse(zip.getInputStream(
                    zip.getEntry('data/stardew_fishing/fish_behaviors.json')))
            def seen = new LinkedHashMap()
            data.behaviors.each { name, p ->
                def values = ['idle_time','top_speed','up_acceleration','down_acceleration','avg_distance','move_variation'].collect { p[it] }
                seen[values.join(',')] = name
            }
            def output = behaviorFile.get().asFile
            output.parentFile.mkdirs()
            output.text = seen.collect { params, name -> "${name},${params}" }.join('\n')
        }
    }
}
tasks.register('simulationTest', JavaExec) {
    group = 'verification'
    description = 'Run 1000 seeded fishing simulations.'
    dependsOn 'simulationClasses', 'prepareSimulation'
    classpath = files(sourceSets.simulation.output, sourceSets.main.runtimeClasspath)
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version.toInteger()) }
    mainClass = 'TreasureIntegrationTest'
    maxHeapSize = '512m'
    args behaviorFile.get().asFile.absolutePath,
            layout.buildDirectory.file('simulation/treasure-1000.csv').get().asFile.absolutePath,
            providers.gradleProperty('simulationCases').getOrElse('')
}
tasks.register('biteRegressionTest', JavaExec) {
    group = 'verification'
    dependsOn 'biteTestClasses'
    classpath = files(sourceSets.biteTest.output, sourceSets.main.runtimeClasspath)
    javaLauncher = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version.toInteger()) }
    mainClass = 'BiteRegressionTest'
}
tasks.named('check') { dependsOn 'simulationTest', 'biteRegressionTest', 'verifyDistribution' }

// Distribution checks.
tasks.register('verifyDistribution') {
    group = 'verification'
    // LegacyForge's jar task creates a development JAR; reobfJar/assemble creates libs/.
    dependsOn 'assemble'
    def releaseFile = layout.buildDirectory.file("libs/${base.archivesName.get()}-${project.version}.jar")
    inputs.file(releaseFile)
    doLast {
        new java.util.zip.ZipFile(releaseFile.get().asFile).withCloseable { zip ->
            def names = zip.entries().collect { it.name }
            def metadata = 'META-INF/mods.toml'
            def other = 'META-INF/neoforge.mods.toml'
            if (!names.contains(metadata) || names.contains(other)) throw new GradleException('Mixed loader metadata')
            def toml = zip.getInputStream(zip.getEntry(metadata)).getText('UTF-8')
            if (!toml.contains('modId="' + mod_id + '"') || toml.contains('${') || toml.contains('sunlit_autofish')) {
                throw new GradleException('Invalid MOD ID or unexpanded metadata')
            }
            def logoPath = "assets/${mod_id}/icon.png"
            def logo = zip.getEntry(logoPath)
            if (!toml.contains('logoFile="' + logoPath + '"') || logo == null) {
                throw new GradleException('Missing mod list icon or metadata reference')
            }
            def expectedIcon = rootProject.file("common/src/main/resources/${logoPath}").bytes
            if (!java.util.Arrays.equals(expectedIcon, zip.getInputStream(logo).bytes)) {
                throw new GradleException('Packaged icon differs from the supplied asset')
            }
            if (names.any { (it.contains('sunlit_autofish') || it.startsWith('assets/stardewfishingautofish/') || it == 'stardewfishingautofish.mixins.json') || it.contains('ClientSmoke') || it.contains('SmokeProbe') || it.startsWith('net/minecraft/') || it.startsWith('com/bonker/') }) {
                throw new GradleException('Old namespace or dependency/test classes leaked into JAR')
            }
            ['en_us','zh_cn'].each { lang ->
                def entry = zip.getEntry("assets/${mod_id}/lang/${lang}.json")
                if (entry == null) throw new GradleException("Missing language ${lang}")
                if (zip.getInputStream(entry).getText('UTF-8').contains('sunlit_autofish')) {
                    throw new GradleException('Old translation keys')
                }
            }
            def mixin = zip.getEntry("${mod_id}.mixins.json")
            if (mixin == null) throw new GradleException('Missing Mixin config')
            def config = new groovy.json.JsonSlurper().parse(zip.getInputStream(mixin))
            if (project.name == 'neoforge') {
                ['LegacyStardewResourceMixin', 'LegacyLegendaryResourceMixin', 'LegacyOptionalLootResourceMixin', 'LegacyDatapackSyncMixin'].each { bridge ->
                    if (!config.client.contains(bridge) || zip.getEntry(config.package.replace('.', '/') + '/' + bridge + '.class') == null) {
                        throw new GradleException('Missing NeoForge 1.20.1 upstream compatibility bridge: ' + bridge)
                    }
                }
            }
            if (zip.getEntry(config.refmap) == null) throw new GradleException('Missing Forge refmap')
            def identity = zip.getInputStream(zip.getEntry('io/github/lichao10/stardewfishingautofish/ModIdentity.class')).bytes
            if (!new String(identity, java.nio.charset.StandardCharsets.ISO_8859_1).contains(mod_id)) {
                throw new GradleException('Wrong runtime MOD ID')
            }
            names.findAll { it.endsWith('.class') }.each { name ->
                def stream = new DataInputStream(zip.getInputStream(zip.getEntry(name)))
                stream.readInt(); stream.readUnsignedShort()
                if (stream.readUnsignedShort() != java_version.toInteger() + 44) throw new GradleException("Wrong Java target: ${name}")
                stream.close()
            }
        }
        logger.lifecycle("Verified production JAR: ${project.name}, ${mod_id}, Java ${java_version}")
    }
}
