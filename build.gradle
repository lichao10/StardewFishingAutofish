plugins {
    id 'base'
    id 'net.neoforged.moddev.legacyforge' version '2.0.148' apply false
}
group = providers.gradleProperty('group').get()
version = providers.gradleProperty('version').get()

ext.expandProps = [
    version: project.version.toString(),
    group: project.group.toString(),
    mod_id: mod_id,
    mod_name: mod_name,
    mod_author: mod_author,
    license: providers.gradleProperty('license').get(),
    description: providers.gradleProperty('description').get(),
    java_version: providers.gradleProperty('java_version').get(),
    minecraft_version: minecraft_version,
    minecraft_version_range: minecraft_version_range,
    stardew_fishing_version: stardew_fishing_version
]
if (!(mod_id ==~ /[a-z][a-z0-9_]{1,63}/)) throw new GradleException('Invalid mod_id')
subprojects {
    group = rootProject.group
    version = rootProject.version
}

tasks.register('verifyReleaseTag') {
    group = 'verification'
    description = 'Check the release tag against the project version.'
    doLast {
        def tag = providers.gradleProperty('releaseTag').orNull
        def tags = ['forge', 'neoforge'].collect { "v${rootProject.version}-mc${minecraft_version}-${it}".toString() }
        if (!(tag in tags)) throw new GradleException("Invalid release tag '${tag}'; expected one of ${tags}")
    }
}

tasks.register('collectArtifacts', Sync) {
    group = 'distribution'
    description = 'Collect the Forge and NeoForge JARs and icon.'
    dependsOn subprojects.collect { it.tasks.named('build') }
    into layout.buildDirectory.dir('releases')
    subprojects.findAll { it.name != 'common' }.each { p ->
        from(p.layout.buildDirectory.file("libs/StardewFishingAutofish-${minecraft_version}-${p.name}-${p.version}.jar")) { into p.name }
    }
    from("common/src/main/resources/assets/${mod_id}/icon.png")
}

tasks.register('publishLocal', Sync) {
    group = 'distribution'
    description = 'Copy the release files to releaseDir.'
    dependsOn 'collectArtifacts'
    def local = new Properties()
    def configFile = file('local.properties')
    if (configFile.exists()) configFile.withInputStream { local.load(it) }
    def configured = providers.gradleProperty('releaseDir').orElse(local.getProperty('releaseDir', ''))
    def destination = configured.map { value ->
        if (!value) throw new GradleException('Set releaseDir in local.properties or pass -PreleaseDir=<folder>')
        def output = file(value).canonicalFile
        def workspace = rootProject.projectDir.canonicalFile.toPath()
        if (output.toPath().nameCount < 2 || workspace.startsWith(output.toPath()) ||
                output.toPath().startsWith(workspace)) {
            throw new GradleException('Invalid releaseDir: expected a dedicated folder outside the source workspace')
        }
        output
    }
    from layout.buildDirectory.dir('releases')
    into destination
    doLast { logger.lifecycle("Published install JARs and icon: ${destinationDir}") }
}

tasks.named('check') { dependsOn subprojects.collect { it.tasks.named('check') } }
tasks.named('assemble') { dependsOn subprojects.collect { it.tasks.named('assemble') } }
tasks.named('clean') { dependsOn subprojects.collect { it.tasks.named('clean') } }
