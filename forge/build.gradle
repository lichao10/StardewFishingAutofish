plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}
project.pluginManager.apply('multiloader-client-smoke')
legacyForge {
    enable {
        forgeVersion = "${minecraft_version}-${loader_version}"
        disableRecompilation = true
    }
    runs {
        client {
            client(); gameDirectory = file('run/client')
            if (providers.gradleProperty('clientSmokeWorld').isPresent()) systemProperty 'autofish.smoke.world', 'true'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        if (providers.gradleProperty('clientSmoke').isPresent()) {
            autofish_smoke { sourceSet sourceSets.clientSmoke }
        }
    }
}
mixin {
    add sourceSets.main, "${mod_id}.refmap.json"
    config "${mod_id}.mixins.json"
}
dependencies {
    modImplementation "maven.modrinth:stardew-fishing:${stardew_fishing_version_id}"
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'
}
tasks.named('jar', Jar) { manifest.attributes('MixinConfigs': "${mod_id}.mixins.json") }
