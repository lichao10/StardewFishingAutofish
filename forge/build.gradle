plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev.legacyforge'
}
project.pluginManager.apply('multiloader-client-smoke')
legacyForge {
    enable {
        forgeVersion = "${minecraft_version}-${forge_version}"
        disableRecompilation = true
    }
    runs {
        client {
            client(); gameDirectory = file(providers.gradleProperty('lavaSmoke').isPresent() ? 'run/lava' : 'run/client')
            if (providers.gradleProperty('clientSmokeWorld').isPresent()) systemProperty 'autofish.smoke.world', 'true'
            if (providers.gradleProperty('lavaSmoke').isPresent()) systemProperty 'autofish.smoke.lava', 'true'
        }
    }
    mods {
        "${mod_id}" { sourceSet sourceSets.main }
        if (providers.gradleProperty('clientSmoke').isPresent()) {
            autofish_smoke { sourceSet sourceSets.clientSmoke }
        }
    }
}
if (providers.gradleProperty('lavaSmoke').isPresent()) {
    tasks.register('prepareLavaSmoke') {
        doLast {
            def config = file('run/lava/config/netherdepthsupgrade-common.toml')
            config.parentFile.mkdirs()
            config.text = 'fish_entities = false\n'
        }
    }
    tasks.named('runClient') { dependsOn 'prepareLavaSmoke' }
}
dependencies {
    modImplementation "curse.maven:stardew-fishing-1066037:${stardew_fishing_file_id}"
    if (providers.gradleProperty('lavaSmoke').isPresent()) {
        modRuntimeOnly 'maven.modrinth:nether-depths-upgrade:pQxWZBvX'
        modRuntimeOnly 'maven.modrinth:geckolib:lxzmD9V4'
    }
}
